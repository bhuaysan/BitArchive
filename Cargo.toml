# BitArchive Cargo workspace.
#
# The workspace contains only the crates that currently exist. A crate is
# introduced by the Issue that needs it, not in advance (ARCHITECTURE.md §5).
#
# Cargo.lock is committed on purpose: BitArchive ships an application, so the
# dependency graph is part of the repository state.

[workspace]
resolver = "3"
members = [
    "apps/bitarchive-desktop",
    "crates/bitarchive-application",
    "crates/bitarchive-domain",
    "crates/bitarchive-emulation",
    "crates/bitarchive-infrastructure",
    "crates/bitarchive-platform",
    "crates/bitarchive-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
slint = "1.17.1"
slint-build = "1.17.1"
# Domain identities are UUIDv7 (ARCHITECTURE.md §7). Only the domain crate needs
# it, and only the `v7` feature is required to generate them.
uuid = { version = "1.26.1", features = ["v7"] }
# SHA-256 is BitArchive's canonical content hash (ARCHITECTURE.md §11). `sha2` is
# the RustCrypto implementation; only SHA-256 is used, and hashing is streaming
# so a large artifact is never held in memory.
sha2 = "0.10.9"
# The HTTP transport of the managed component acquisition paths (Issues #19 and
# #21). See `crates/bitarchive-infrastructure/src/http_download.rs` for why this
# step uses a synchronous, narrowly scoped client and not yet the shared async
# network layer of ARCHITECTURE.md §31.
ureq = "3.4.2"
# Reading the ZIP archive an official libretro core is published as (Issue #21).
# The test suite also writes DEFLATE fixtures with it, so the extraction rules can
# be tested against archives that are deliberately malformed.
#
# `default-features = false` and one feature on purpose: the default set pulls in
# bzip2, deflate64, lzma, ppmd, zstd, xz, AES, and time handling, none of which the
# official libretro build host uses for a core archive — it publishes one DEFLATE
# member. Only DEFLATE is enabled, and only through the pure-Rust `zlib-rs` backend,
# so no C toolchain and no system zlib becomes a build requirement.
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
