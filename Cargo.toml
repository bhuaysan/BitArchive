# BitArchive Cargo workspace.
#
# The workspace intentionally contains only the crates that currently exist.
# Domain, application, infrastructure, emulation, and platform crates are added
# as soon as implementation work requires them (ARCHITECTURE.md §5).
#
# Cargo.lock is committed on purpose: BitArchive ships an application, so the
# dependency graph is part of the repository state.

[workspace]
resolver = "3"
members = [
    "apps/bitarchive-desktop",
    "crates/bitarchive-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
slint = "1.17.1"
slint-build = "1.17.1"
